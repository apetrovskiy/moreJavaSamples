apiVersion: apps/v1
kind: Deployment
metadata:
  name: scala-rest-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: scala-rest-api
  template:
    metadata:
      labels:
        app: scala-rest-api
    spec:
      containers:
      - name: app
        image: scala-rest-api:latest
        ports:
        - containerPort: 8080
        env:
        - name: DB_TYPE
          value: "mongodb"
        - name: DB_URL
          value: "mongodb://mongodb:27017"

---
apiVersion: v1
kind: Service
metadata:
  name: scala-rest-api
spec:
  selector:
    app: scala-rest-api
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080