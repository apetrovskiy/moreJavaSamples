version: '3.8'

services:
  app:
    build: .
    ports:
      - "8080:8080"
    depends_on:
      - wiremock
  wiremock:
    image: wiremock/wiremock:3.0.1
    ports:
      - "8081:8080"
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: example
    ports:
      - "5432:5432"