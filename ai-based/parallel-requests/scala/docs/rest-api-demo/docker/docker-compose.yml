version: '3.8'
services:
  rest-api-demo:
    build: .
    ports:
      - "8080:8080"
    environment:
      - JAVA_OPTS=-Xmx512m
  mock-server:
    image: wiremock/wiremock:2.35.0
    ports:
      - "8081:8080"
    volumes:
      - ./mock-server:/home/wiremock
  h2-database:
    image: oscarfonts/h2
    ports:
      - "8082:8082"
    environment:
      - H2_OPTIONS=-web -webAllowOthers -webPort 8082