version: '3.8'

services:
  app:
    build: .
    ports:
      - "8080:8080"
    depends_on:
      - wiremock
      - mongo

  wiremock:
    image: rodolpheche/wiremock
    ports:
      - "8081:8080"
    volumes:
      - ./wiremock:/home/wiremock/mappings
    environment:
      - WIREMOCK_DELAY_MS=500
      - WIREMOCK_ERROR_RATE=10

  mongo:
    image: mongo:5.0
    ports:
      - "27017:27017"